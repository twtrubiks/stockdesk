name: Android release

# 發一版給別人下載的 APK：build、用發版金鑰簽名、放到 GitHub Release（tag 是 v<版本>）。
# README 的下載連結指向 releases/latest/download/stockdesk.apk，永遠是最新的那一版。
# 三種發法，版本已經發過的話就跳過（merge 進 main 時也不會重發）：
#   - 改 release-version（例如 1.0.1）推上去——
#     Claude 雲端 session 只能推自己的 branch、推不了 tag，用這個
#   - 推一個 tag：git tag v1.0.1 && git push origin v1.0.1（版本就是 tag 後面那段）
#   - 手動觸發：Actions → Android release → Run workflow，版本照 release-version
#
# 每一版都要用同一把金鑰簽，手機上的舊版才能直接更新；換了金鑰只能移除重裝。
# 金鑰放在 Secrets（怎麼產生、怎麼設見 docs/release-key.md），憑證的 SHA-256 寫在下面的 EXPECTED_CERT：
#   ANDROID_SIGNING_KEYSTORE  PKCS12 金鑰檔的 base64（alias 是 stockdesk）
#   ANDROID_SIGNING_PASSWORD  金鑰檔與金鑰的密碼
# 簽完會核對憑證的 SHA-256 跟 EXPECTED_CERT 一樣，Secret 被換成別把金鑰的話就不發版。
on:
  push:
    branches-ignore: [media]
    tags: ['v*']
    # 只看 branch 的推送；推 tag 時不比對 paths
    paths: ['release-version']
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # 發版金鑰的憑證 SHA-256，64 碼小寫十六進位（2026-11-08 產生）。**不要改**：改了表示換了金鑰，手機上的舊版就不能更新
  EXPECTED_CERT: 'fb2cfef2e4a61a4c8beb1dd04967cb8139857cd66c57571b25f6e1459eb25a2e'

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name=$(tr -d '[:space:]' < release-version)
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if gh release view "v$name" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::v$name 已經發過了，這次不重發。要發新版就改 release-version"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build & publish APK
    needs: version
    if: needs.version.outputs.released != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STOCKDESK_VERSION_NAME: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unpack signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$EXPECTED_CERT" ]; then
            echo "::error::release.yml 的 EXPECTED_CERT 是空的：照 docs/release-key.md 填進發版金鑰的憑證 SHA-256"
            exit 1
          fi
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::還沒有設定 ANDROID_SIGNING_KEYSTORE / ANDROID_SIGNING_PASSWORD（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/stockdesk-release.p12"

      # versionCode 用 2026-01-01 起算的分鐘數：不管從哪個 branch 發、merge 時怎麼壓 commit，新版都比舊版大
      - name: Version code
        run: echo "STOCKDESK_VERSION_CODE=$(( ($(date -u +%s) - 1767225600) / 60 ))" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          STOCKDESK_KEYSTORE: ${{ runner.temp }}/stockdesk-release.p12
          STOCKDESK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          ./gradlew test assembleRelease
          mkdir -p dist
          # APK 按 CPU 拆開（GeckoView 每種 CPU 一份引擎），手機是 arm64-v8a
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/stockdesk.apk

      - name: Verify signature
        shell: bash
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          out=$("$apksigner" verify --verbose --print-certs dist/stockdesk.apk 2>&1)
          echo "$out"
          cert=$(printf '%s\n' "$out" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $NF}' || true)
          echo "憑證 SHA-256：$cert"
          if [ "$cert" != "$EXPECTED_CERT" ]; then
            echo "::error::簽名用的金鑰跟之前發的版本不同（$cert），手機上的舊版會沒辦法更新。檢查 ANDROID_SIGNING_KEYSTORE"
            exit 1
          fi
          echo "APK_SHA256=$(sha256sum dist/stockdesk.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$STOCKDESK_VERSION_NAME"
          cat > dist/notes.md <<EOF
          StockDesk $STOCKDESK_VERSION_NAME（commit ${GITHUB_SHA::7}）。

          用手機下載 \`stockdesk.apk\` 點開安裝；第一次會要你允許瀏覽器「安裝不明來源的應用程式」。
          已經裝了舊版的話直接安裝這一版就會更新。Android 9 以上的 arm64 手機；內含 GeckoView（Firefox 的引擎），APK 約 95 MB。

          - APK SHA-256：\`$APK_SHA256\`
          - 簽章憑證 SHA-256：\`$EXPECTED_CERT\`
          EOF
          gh release create "$tag" dist/stockdesk.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "StockDesk $STOCKDESK_VERSION_NAME" \
            --notes-file dist/notes.md
          echo "發好了：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$tag"
